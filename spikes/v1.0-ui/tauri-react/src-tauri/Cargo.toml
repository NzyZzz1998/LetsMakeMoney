[package]
name = "lmm_v1_tauri_spike"
version = "1.0.0"
description = "LetsMakeMoney v1.0 Tauri technology spike"
edition = "2021"

[lib]
name = "lmm_v1_tauri_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
