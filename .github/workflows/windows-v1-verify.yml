name: Windows v1 verification

on:
  pull_request:
  push:
    branches: [main, test]

permissions:
  contents: read

jobs:
  verify:
    name: Windows v1 verification
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/windows-v1/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97.1"
          targets: x86_64-pc-windows-msvc
      - name: Fetch locked Rust dependencies
        working-directory: apps/windows-v1/src-tauri
        run: cargo fetch --locked
      - name: Install frontend dependencies
        working-directory: apps/windows-v1
        run: npm ci
      - name: Restore locked v1.0.3 release evidence
        shell: pwsh
        run: |
          $assetDirectory = "releases/v1.0.3"
          $assetName = "LetsMakeMoney-v1.0.3-windows-x86_64.zip"
          $assetPath = Join-Path $assetDirectory $assetName
          $expectedSha256 = "259CAE23D785FC7712CAC0EFD42991C8EE210C0BCEA1EB5C07FC171DFB993B28"
          $assetUrl = "https://github.com/NzyZzz1998/LetsMakeMoney/releases/download/v1.0.3/$assetName"

          New-Item -ItemType Directory -Force -Path $assetDirectory | Out-Null
          Invoke-WebRequest -Uri $assetUrl -OutFile $assetPath

          $actualSha256 = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "v1.0.3 release asset SHA256 mismatch: $actualSha256"
          }
      - name: Diagnose pinned Windows environment
        shell: pwsh
        run: |
          ./scripts/diagnose_v104_environment.ps1
      - name: Verify current Windows release contracts and UI
        shell: pwsh
        run: |
          ./scripts/verify_v104.ps1
