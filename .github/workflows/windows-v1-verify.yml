name: Windows v1 verification

on:
  pull_request:
  push:
    branches: [main, test]

permissions:
  contents: read

jobs:
  verify:
    name: Windows v1 verification
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/windows-v1/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97.1"
          targets: x86_64-pc-windows-msvc
      - name: Fetch locked Rust dependencies
        working-directory: apps/windows-v1/src-tauri
        run: cargo fetch --locked
      - name: Install frontend dependencies
        working-directory: apps/windows-v1
        run: npm ci
      - name: Verify current Windows contracts and build
        shell: pwsh
        run: |
          ./scripts/verify_windows_current.ps1
