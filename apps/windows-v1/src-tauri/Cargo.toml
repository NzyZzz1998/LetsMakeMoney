[package]
name = "letsmakemoney_windows_v1"
version = "1.0.2"
description = "LetsMakeMoney Windows v1.0.2"
edition = "2021"

[lib]
name = "letsmakemoney_windows_v1_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["tray-icon"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
