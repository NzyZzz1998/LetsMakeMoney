<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">LetsMakeMoney</title>
  <desc id="desc">A local-first Windows earnings progress utility with the Oatmeal Graphite identity and a compact Mini view.</desc>

  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#30302B" flood-opacity=".12"/>
    </filter>
    <filter id="miniShadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#30302B" flood-opacity=".15"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="30" fill="#F7F4EE"/>
  <path d="M0 354C213 323 357 385 556 358c218-29 343-104 644-70v132H0Z" fill="#EEE9DF"/>

  <g transform="translate(62 53)" filter="url(#shadow)">
    <rect width="82" height="82" rx="24" fill="#EEE9DF" stroke="#D8D1C5"/>
    <path d="M15 51 31 22l12 19-6 10Zm27-10 12-19 16 29H49Z" fill="#30302B"/>
    <rect x="15" y="59" width="55" height="9" rx="4.5" fill="#778B7B"/>
    <rect x="15" y="59" width="33" height="9" rx="4.5" fill="#D89B26"/>
  </g>

  <text x="166" y="78" font-family="Segoe UI, Microsoft YaHei UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#6E6A62">WINDOWS · LOCAL FIRST · v1.0 FINAL</text>
  <text x="62" y="185" font-family="Segoe UI, Microsoft YaHei UI, Arial, sans-serif" font-size="62" font-weight="730" fill="#30302B">LetsMakeMoney</text>
  <text x="64" y="231" font-family="Segoe UI, Microsoft YaHei UI, Arial, sans-serif" font-size="30" font-weight="650" fill="#30302B">把今天的工作，变成看得见的收入进度</text>
  <text x="64" y="275" font-family="Segoe UI, Microsoft YaHei UI, Arial, sans-serif" font-size="21" fill="#6E6A62">今日已赚 · 阶段倒计时 · 日历与加班 · 数据只留在本机</text>

  <g transform="translate(64 314)">
    <rect width="146" height="40" rx="20" fill="#30302B"/>
    <text x="73" y="26" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#F7F4EE">无需账号</text>
    <rect x="158" width="174" height="40" rx="20" fill="#FFFFFF" stroke="#D8D1C5"/>
    <text x="245" y="26" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#30302B">浅色 / 深色</text>
    <rect x="344" width="192" height="40" rx="20" fill="#E3ECE4"/>
    <text x="440" y="26" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#46684E">Windows 11</text>
  </g>

  <g transform="translate(760 92)" filter="url(#miniShadow)">
    <rect width="372" height="176" rx="22" fill="#FFFDFC" stroke="#D8D1C5"/>
    <g transform="translate(24 23)">
      <circle cx="21" cy="21" r="21" fill="#EEE9DF"/>
      <path d="M10 27 17 13l6 9-3 5Zm13-5 6-9 8 14h-11Z" fill="#30302B"/>
      <rect x="10" y="31" width="27" height="4.5" rx="2.25" fill="#778B7B"/>
      <rect x="10" y="31" width="16" height="4.5" rx="2.25" fill="#D89B26"/>
    </g>
    <text x="83" y="36" font-family="Segoe UI, Microsoft YaHei UI, Arial, sans-serif" font-size="15" fill="#6E6A62">工作中</text>
    <text x="83" y="72" font-family="Segoe UI, Microsoft YaHei UI, Arial, sans-serif" font-size="34" font-weight="720" fill="#30302B">¥ 186.42</text>
    <text x="348" y="36" text-anchor="end" font-family="Segoe UI, Microsoft YaHei UI, Arial, sans-serif" font-size="14" fill="#55765D">本地计算</text>
    <rect x="24" y="101" width="324" height="8" rx="4" fill="#E7E3DA"/>
    <rect x="24" y="101" width="181" height="8" rx="4" fill="#D89B26"/>
    <text x="24" y="134" font-family="Segoe UI, Microsoft YaHei UI, Arial, sans-serif" font-size="15" fill="#6E6A62">工作进度 56%</text>
    <text x="348" y="134" text-anchor="end" font-family="Segoe UI, Microsoft YaHei UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#30302B">距离下班 04:38:20</text>
    <circle cx="28" cy="157" r="5" fill="#778B7B"/>
    <text x="42" y="162" font-family="Segoe UI, Microsoft YaHei UI, Arial, sans-serif" font-size="14" fill="#55765D">配置与记录仅保存在本机</text>
  </g>

  <g transform="translate(1005 286)">
    <rect width="128" height="42" rx="21" fill="#30302B"/>
    <text x="64" y="27" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#F7F4EE">Mini 视图</text>
  </g>
</svg>
