<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">LetsMakeMoney</title>
  <desc id="desc">A Windows income progress utility with a compact earnings window and daily workbench.</desc>
  <defs>
    <linearGradient id="progress" x1="0" x2="1">
      <stop offset="0" stop-color="#78A781"/>
      <stop offset="1" stop-color="#EBAA24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#262522" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#F1F2EF"/>
  <circle cx="74" cy="66" r="22" fill="#EBAA24"/>
  <text x="74" y="74" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#342600">¥</text>
  <text x="112" y="73" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#67645E">WINDOWS · LOCAL FIRST · v1.0</text>

  <text x="64" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="720" fill="#262522">LetsMakeMoney</text>
  <text x="66" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="650" fill="#262522">把工作时间，变成看得见的收入进度</text>
  <text x="66" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#67645E">今日已赚 · 工作进度 · 距离下班</text>

  <g transform="translate(66 294)">
    <rect width="168" height="42" rx="10" fill="#FFF1C9" stroke="#EBAA24"/>
    <text x="84" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#342600">无需账号</text>
    <rect x="180" width="168" height="42" rx="10" fill="#FCFCFA" stroke="#C9C8C1"/>
    <text x="264" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#262522">数据留在本机</text>
    <rect x="360" width="168" height="42" rx="10" fill="#E8F1E9" stroke="#78A781"/>
    <text x="444" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#3F704B">Windows x86_64</text>
  </g>

  <g transform="translate(710 62)" filter="url(#shadow)">
    <rect width="420" height="290" rx="18" fill="#FCFCFA" stroke="#C9C8C1"/>
    <rect x="1" y="1" width="418" height="50" rx="17" fill="#FFFFFF"/>
    <path d="M1 50h418" stroke="#DEDED8"/>
    <circle cx="29" cy="26" r="14" fill="#EBAA24"/>
    <text x="29" y="32" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#342600">¥</text>
    <text x="54" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#262522">今日收入进度</text>

    <rect x="26" y="76" width="368" height="124" rx="12" fill="#FFFAF0" stroke="#E8DCC1"/>
    <text x="48" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#67645E">今日已赚</text>
    <text x="48" y="153" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="720" fill="#262522">¥ 301.08</text>
    <text x="48" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#67645E">日薪 ¥500.00 · 时薪 ¥62.50</text>

    <rect x="26" y="218" width="368" height="7" rx="4" fill="#E8E7E1"/>
    <rect x="26" y="218" width="221" height="7" rx="4" fill="url(#progress)"/>
    <text x="26" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#67645E">工作进度</text>
    <text x="394" y="252" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#262522">60%</text>
    <circle cx="31" cy="273" r="5" fill="#5E8D6B"/>
    <text x="45" y="279" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#3F704B">工作中</text>
    <text x="394" y="279" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#67645E">距离下班 03:10:58</text>
  </g>
</svg>
